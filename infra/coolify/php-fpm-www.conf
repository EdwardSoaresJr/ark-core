; ARK runtime host profile v1 — 2–4 GB hosts (small production hosts).
; Applied in Dockerfile via sed on the stock php:8.4-fpm www pool.
[www]
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
; Inherit container env (APP_KEY from entrypoint bootstrap, DB_*, REDIS_*, …).
clear_env = no
