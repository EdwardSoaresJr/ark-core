[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

[program:horizon]
command=/usr/local/bin/php /app/artisan horizon
directory=/app
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/app/storage/logs/horizon.log
stderr_logfile=/app/storage/logs/horizon.log

[program:reverb]
command=/usr/local/bin/php /app/artisan reverb:start --host=0.0.0.0 --port=9090
directory=/app
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/app/storage/logs/reverb.log
stderr_logfile=/app/storage/logs/reverb.log

[program:scheduler]
command=/usr/local/bin/php /app/artisan schedule:work
directory=/app
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/app/storage/logs/scheduler.log
stderr_logfile=/app/storage/logs/scheduler.log
