name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    # The suite forces SQLite :memory: in phpunit.xml. It does not use MySQL.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, gd, intl, mbstring, pcntl, sqlite, sodium, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test:serial -- --log-junit junit.xml

      - name: List failures in baseline format
        if: always()
        run: |
          if [[ -f junit.xml ]]; then
            php scripts/core-test-baseline.php failures junit.xml | sed 's/$/\tTODO: tracking note/' > baseline-candidate.tsv
            php scripts/core-test-baseline.php compare junit.xml tests/baselines/github-ubuntu-latest-php8.4.tsv || true
          fi

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-junit-${{ github.sha }}
          path: |
            junit.xml
            baseline-candidate.tsv
          if-no-files-found: ignore
