name: Tests

# Fast checks for every pull request and every push to main. The full suite runs nightly on main and on request
# (regression.yml); see CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, gd, intl, mbstring, pcntl, sqlite, sodium, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax of changed files
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.php' ':!*.blade.php' | while IFS= read -r file; do
            php -l "$file" > /dev/null
          done

      - name: JavaScript syntax of changed files
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'resources/js/*.js' 'public/js/ark/*.js' | while IFS= read -r file; do
            node --check "$file"
          done

      - name: Blade views compile
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan view:cache

      - name: Pint on changed files (advisory; several files predate the style rules)
        continue-on-error: true
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.php' ':!*.blade.php')
          if [ -n "$files" ]; then vendor/bin/pint --test $files; fi

  security:
    runs-on: ubuntu-latest
    # Authentication, permissions, sessions, signed access, isolation between records and test databases: on every
    # change, whatever it touches. Payment tests join when the change touches payments or billing.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, gd, intl, mbstring, pcntl, sqlite, sodium, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security and isolation tests
        run: |
          set -euo pipefail
          tests=(
            tests/Feature/Auth
            tests/Feature/Authorization
            tests/Feature/Runtime/SecurityHardeningTest.php
            tests/Feature/Platform/SessionCookieDomainTest.php
            tests/Feature/Operations/EstimateAccessTokenSecurityTest.php
            tests/Feature/Operations/Portal/StaffPortalSessionTest.php
            tests/Feature/Communications/TwilioWebhookSignatureTest.php
            tests/Feature/Operations/RepairOrderReadCacheIsolationTest.php
            tests/Feature/Testing/TestExecutionIsolationTest.php
            tests/Unit/Testing/TestDatabaseIsolationBleedTest.php
          )
          if git diff --name-only "$BASE"...HEAD | grep -Eiq 'payment|square|billing|invoice|terminal'; then
            tests+=(
              tests/Feature/Operations/Payments
              tests/Unit/Operations/Payments
              tests/Feature/Mobile/MobilePaymentCaptureTest.php
              tests/Feature/Operations/SendPaymentLinkTest.php
            )
          fi
          present=()
          for test in "${tests[@]}"; do
            if [ -e "$test" ]; then present+=("$test"); fi
          done
          php -d memory_limit=1024M vendor/bin/pest --no-coverage "${present[@]}"

  targeted:
    runs-on: ubuntu-latest
    # Repair-order cache checks and the needs-attention regressions, on every change.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, gd, intl, mbstring, pcntl, sqlite, sodium, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run targeted regression checks
        run: |
          set -euo pipefail
          php vendor/bin/pest --no-coverage \
            tests/Feature/Operations/RepairOrderReadCacheIsolationTest.php \
            tests/Feature/Operations/RepairOrderQueryScalingRegressionTest.php
          attention=(
            tests/Feature/Communications/AdvisorAttentionAcceptanceTest.php
            tests/Feature/Operations/Financial/AdvisorFinancialSeparationTest.php
            tests/Feature/Operations/TelephonyCallQueueTest.php
            tests/Feature/Communications/ConversationsH0TurnPrecedenceTest.php
            tests/Feature/Communications/ConversationsH0SarahSagaTest.php
          )
          present=()
          for file in "${attention[@]}"; do
            if [ -f "$file" ]; then
              present+=("$file")
            fi
          done
          if [ "${#present[@]}" -gt 0 ]; then
            php vendor/bin/pest --no-coverage "${present[@]}"
          fi
          if [ -f tests/Feature/Operations/CommunicationsQueueTest.php ]; then
            php vendor/bin/pest --no-coverage --filter 'communications queue api includes ringing and active calls' \
              tests/Feature/Operations/CommunicationsQueueTest.php
          fi

  focused:
    runs-on: ubuntu-latest
    # The tests relevant to what changed (scripts/ci-focused-tests.sh), not the whole suite.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, gd, intl, mbstring, pcntl, sqlite, sodium, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests for the changed files
        run: |
          set -euo pipefail
          mapfile -t tests < <(bash scripts/ci-focused-tests.sh "$BASE" 2> "$RUNNER_TEMP/broad.txt")
          if [ -s "$RUNNER_TEMP/broad.txt" ]; then
            echo "::notice::This change touches $(sed 's/^broad: //' "$RUNNER_TEMP/broad.txt" | paste -sd ', ' -). A name search cannot follow its reach; add the full-regression label if it is high-risk."
          fi
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No tests name the changed files."
            exit 0
          fi
          printf 'Running %d test files:\n' "${#tests[@]}"
          printf '  %s\n' "${tests[@]}"
          php -d memory_limit=2048M vendor/bin/pest --no-coverage "${tests[@]}"

  communications-boundary:
    runs-on: ubuntu-latest
    # Public Core must not grow communications code (docs/PRODUCT_BOUNDARY.md). A missing route list or baseline fails.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, gd, intl, mbstring, pcntl, sqlite, sodium, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: List routes
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: "null"
        run: php artisan route:list --json > "$RUNNER_TEMP/routes.json"

      - name: Reject new communications code, and any baseline growth against the target branch
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE:scripts/communications-baseline.json" 2>/dev/null; then
            git show "$BASE:scripts/communications-baseline.json" > "$RUNNER_TEMP/previous-baseline.json"
            php scripts/assert-no-communications.php --routes "$RUNNER_TEMP/routes.json" --previous-baseline "$RUNNER_TEMP/previous-baseline.json"
          elif git cat-file -e "$BASE:scripts/assert-no-communications.php" 2>/dev/null; then
            echo "The target branch has the communications check but no baseline." >&2
            exit 1
          else
            echo "The target branch predates the communications check; this change introduces the baseline."
            php scripts/assert-no-communications.php --routes "$RUNNER_TEMP/routes.json"
          fi

      - name: Prove the check, including tables created by a fresh install
        run: php vendor/bin/pest --no-coverage tests/Feature/Architecture/CommunicationsBoundaryTest.php
