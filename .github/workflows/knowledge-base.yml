name: Knowledge base

on:
  pull_request:
    paths:
      - 'docs/knowledge-base/**'
      - '.github/workflows/knowledge-base.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/knowledge-base/**'
      - '.github/workflows/knowledge-base.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/knowledge-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/knowledge-base/package-lock.json
      - run: npm ci
      - run: npm run check:refs
      - run: npm run build
