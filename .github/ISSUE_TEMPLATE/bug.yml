name: Bug
description: A defect in self-hosted ARK Core
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, customer data, VINs from real customers, or live shop hostnames.
  - type: textarea
    id: behavior
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Core installed?
      options:
        - Docker Compose
        - Local PHP
        - Other self-hosted
    validations:
      required: true
