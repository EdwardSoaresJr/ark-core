[package]
name = "forge-projection"
version = "0.1.0"
edition = "2021"
description = "Engineering Projection — derives EngineeringState from Forge Core capabilities"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
forge-core = { path = "../core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
