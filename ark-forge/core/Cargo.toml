[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"
description = "Forge Core — authority for local workstation capabilities"

[lib]
name = "forge_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
