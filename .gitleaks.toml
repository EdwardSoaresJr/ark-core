title = "ARK Core"
minVersion = "8.18.0"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures that are not credentials"
regexTarget = "match"
regexes = [
  '''jeep-wrangler-2014''',
  '''BEGIN PRIVATE KEY-----\\ntest\\n-----END PRIVATE KEY''',
  '''example-token-value-not-real''',
  # Historical docs false positive: "scheduling/appointment" matched generic-api-key.
  '''scheduling/appointment''',
]
paths = [
  '''docs/releases/traditional-hosting-runtime-profiles\.md''',
]
